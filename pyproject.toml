[build-system]
requires = ["setuptools",
            "wheel",
            "Cython",
            "numpy>=2.0.0; python_version >= '3.9'",
            "scipy"]

[tool.ruff]
target-version = "py39"
line-length = 120
select = ["D"]
ignore = ["D415", "D400", "D212", "D205", "D203", "D105"]

[tool.ruff.pydocstyle]
convention = "numpy"